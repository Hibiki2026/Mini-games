<script>

(()=>{

function read(key,fallback){try{let v=localStorage.getItem(key);return v===null?fallback:v}catch{return fallback}}function store(key,v){try{localStorage.setItem(key,String(v))}catch{}}

function tone(f=440,end=660,d=.1){if(muted||!audio||audio.state!=='running')return;try{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(end,t+d);g.gain.setValueAtTime(.075,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.01)}catch{}}

function resize(){W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);scale=clamp(H/620,.55,1.35);viewW=W/scale;viewH=H/scale;groundScreen=viewH*.76;ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0)}
function show(el,yes){$(el).classList.toggle('hidden',!yes)}function notify(s){$('toast').textContent=s;show('toast',true);toastTime=1.5}

function ui(){show('menu',mode==='menu');show('result',mode==='result');show('paused',mode==='pause');show('action',['ready','swing','fly','pipe'].includes(mode));show('meter',mode==='swing');$('pause').disabled=['menu','result'].includes(mode);$('pause').textContent=mode==='pause'?'▶':'Ⅱ';const a=$('act');a.disabled=mode==='pipe';a.textContent=mode==='ready'?'スイング開始':mode==='swing'?'今だ！ 発射':mode==='pipe'?'パイプ移動中…':diveReady?'急降下！':'バウンドで回復';a.disabled=mode==='pipe'||(mode==='fly'&&!diveReady);$('hint').textContent=mode==='ready'?'Space / タップで開始':mode==='swing'?'緑の範囲でタイミングよくタップ！':mode==='fly'?'空中でタップすると急降下 · 着地で再使用可能':'自動で飛び出すよ'}
function reset(){const t=types[selected];p={x:120,y:0,vx:0,vy:0,rot:0,r:t.r,grounded:false};p.y=terrain(p.x)-p.r;camX=0;camY=0;world=[];flowers=[];particles=[];nextX=430;flowerX=p.x;seed=202618;spin=0;elapsed=0;stopTime=0;pipeTime=0;pipe=null;runBest=best;distance=0;bloom=0;boosts=0;diveReady=true;toastTime=0;show('toast',false);generate(2200);refresh()}
function generate(target){while(nextX<target+1500){const x=nextX,roll=rnd();let kind=roll<.40?'mushroom':roll<.54?'log':roll<.66?'mud':roll<.77?'pipe':roll<.91?'cloud':'mega';let w=kind==='mud'?145:kind==='cloud'?125:kind==='log'?95:kind==='pipe'?48:kind==='mega'?66:48;const y=terrain(x)-(kind==='cloud'?random(150,350):kind==='pipe'?42:kind==='log'?19:kind==='mud'?0:kind==='mega'?42:31);world.push({x,y,w,kind,used:false});nextX+=random(230,390)} }

function launch(){const q=clamp(1-Math.abs(spin-.755)/.755,0,1),t=types[selected];let angle=lerp(.18,1.32,spin),v=(510+q*650)*t.speed;p.x=120+95*Math.cos(angle);p.y=-105-80*Math.sin(angle);p.vx=v*Math.cos(angle);p.vy=-v*Math.sin(angle);p.rot=0;mode='fly';plays++;store('gnomePlays',plays);notify(q>.90?'PERFECT!':q>.65?'GOOD!':'LET’S GO!');tone(220,780,.21);ui()}
function input(){audioStart();if(mode==='menu'||mode==='result'){ready();return}if(mode==='ready'){mode='swing';spin=0;ui();tone(200,340);return}if(mode==='swing'){launch();return}if(mode==='fly'&&diveReady&&!p.grounded){p.vy=Math.max(360,p.vy+580);p.vx*=1.04;diveReady=false;notify('急降下！');tone(520,130,.16);ui()}}
function togglePause(){if(mode==='pause'){mode=previous;acc=0;ui()}else if(['ready','swing','fly','pipe'].includes(mode)){previous=mode;mode='pause';acc=0;ui()}}
function finish(){if(mode==='result')return;mode='result';best=Math.max(best,distance);store('gnomeBest',Math.floor(best));$('finalDistance').textContent=Math.floor(distance)+' m';$('finalInfo').textContent='花 '+bloom+' 本　·　ブースト '+boosts+' 回　·　プレイ '+plays+' 回';$('resultTag').textContent=distance>runBest?'NEW PERSONAL BEST!':'GARDEN COMPLETE';refresh();tone(420,840,.3);ui()}
function burst(x,y,color,count=12){for(let i=0;i<count;i++){const a=TAU*hash(i+elapsed*47),v=30+hash(i+17)*170;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-50,life:.65+hash(i+4)*.4,color})}if(particles.length>300)particles.splice(0,particles.length-300)}
function boost(o){if(o.used)return;o.used=true;boosts++;diveReady=true;p.grounded=false;const mega=o.kind==='mega',cloud=o.kind==='cloud';p.y=o.y-p.r-1;p.vy=-Math.min(mega?2350:cloud?1050:1350,Math.max(mega?1550:cloud?530:750,Math.abs(p.vy)*(mega?1.18:1.03)));p.vx=Math.min(1300,Math.max(p.vx*(mega?1.15:1.035),mega?700:340));notify(mega?'SUPER MUSHROOM!':cloud?'CLOUD BOOST!':o.kind==='log'?'LOG BOOST!':'MUSHROOM!');burst(p.x,o.y,mega?'#ffcc4c':'#f9edb7');tone(300,mega?1100:750,.16);ui()}
function step(dt){if(mode==='pause'||mode==='menu'||mode==='result')return;if(toastTime>0&&(toastTime-=dt)<=0)show('toast',false);if(mode==='swing'){spin+=dt*.62;if(spin>=1){spin=1;launch()}$('marker').style.left=(spin*100)+'%';return}if(mode!=='fly'&&mode!=='pipe')return;elapsed+=dt;const t=types[selected];if(mode==='pipe'){pipeTime+=dt;if(pipeTime>.65){p.x=pipe.x+75;p.y=terrain(p.x)-90;p.vx=780;p.vy=-1150;p.rot=0;pipe=null;mode='fly';diveReady=true;notify('PIPE BOOST!');tone(220,930,.24);ui()}}else{const oldX=p.x,oldBottom=p.y+p.r;p.vx*=Math.exp(-t.drag*dt);p.vy=Math.min(2300,p.vy+870*dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vx*dt/(p.r*1.4);p.grounded=false;let hit=false;

const g=terrain(p.x);if(!hit&&p.y+p.r>=g){p.y=g-p.r;const mud=world.some(o=>o.kind==='mud'&&Math.abs(p.x-o.x)<o.w/2);if(p.vy>105&&!mud){p.vy=-Math.min(1050,p.vy*t.bounce);p.vx*=.90;p.grounded=false;burst(p.x,g,'#e2cf9e',5);tone(110,170,.05)}else{p.vy=0;p.grounded=true;p.vx*=Math.exp(-(mud?5.5:1.65)*dt)}if(!diveReady){diveReady=true;ui()}}

while(flowerX+24<p.x){flowerX+=24;bloom++;flowers.push({x:flowerX,type:bloom%5})}distance=Math.max(distance,(p.x-120)/10);best=Math.max(best,distance);camX=lerp(camX,Math.max(0,p.x-viewW*.34),1-Math.exp(-dt*6));camY=lerp(camY,Math.min(0,p.y+viewH*.48),1-Math.exp(-dt*5));generate(p.x+viewW);world=world.filter(o=>o.x>camX-500);flowers=flowers.filter(o=>o.x>camX-100);for(const v of particles){v.x+=v.vx*dt;v.y+=v.vy*dt;v.vy+=270*dt;v.life-=dt}particles=particles.filter(v=>v.life>0)}
function ellipse(c,x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill()}
function poly(c,points,color){c.fillStyle=color;c.beginPath();c.moveTo(...points[0]);for(let i=1;i<points.length;i++)c.lineTo(...points[i]);c.closePath();c.fill()}

function sky(){const a=clamp((-camY-450)/1300,0,1),gr=ctx.createLinearGradient(0,0,0,viewH);gr.addColorStop(0,a>.5?'#142448':'#88cbd9');gr.addColorStop(1,a>.5?'#56517c':'#fff0c7');ctx.fillStyle=gr;ctx.fillRect(0,0,viewW,viewH);if(a>.5){ctx.save();ctx.globalAlpha=clamp((a-.5)*2,0,1);for(let i=0;i<95;i++){ellipse(ctx,mod(hash(i)*2000-camX*.08,viewW),mod(hash(i+200)*1000-camY*.05,viewH),.7+hash(i+400)*1.6,.7+hash(i+400)*1.6,'#fff4cb')}const cx=viewW*.72,cy=viewH*.3,pts=[[-25,8],[-18,-12],[-9,-29],[7,-42],[22,-10],[27,8],[20,26],[0,33],[-20,26]];ctx.strokeStyle='#d8eaff';ctx.lineWidth=1;ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(cx+x,cy+y):ctx.moveTo(cx+x,cy+y));ctx.closePath();ctx.stroke();pts.forEach(([x,y])=>ellipse(ctx,cx+x,cy+y,2,2,'#fff'));ctx.restore();return}ellipse(ctx,viewW*.79,viewH*.20,45,45,'#fff3be');for(let i=-1;i<Math.ceil(viewW/220)+1;i++){let x=i*220-mod(camX*.12,220),y=80+hash(i+Math.floor(camX*.12/220))*80;ellipse(ctx,x,y,45,16,'#fff9e8b0');ellipse(ctx,x+27,y-8,34,21,'#fff9e8b0')}for(let layer=0;layer<2;layer++){const base=groundScreen-40-layer*45-camY*.28;ctx.fillStyle=layer===0?'#8dbf9d':'#a9cda7';ctx.beginPath();ctx.moveTo(0,viewH);for(let x=0;x<=viewW+20;x+=20)ctx.lineTo(x,base+Math.sin((x+camX*(.12+layer*.06))/180)*35+Math.sin((x+camX*.14)/77)*10);ctx.lineTo(viewW,viewH);ctx.closePath();ctx.fill()}}
function sx(x){return x-camX}function sy(y){return groundScreen+y-camY}function ground(){ctx.beginPath();ctx.moveTo(0,viewH+100);for(let x=0;x<=viewW+12;x+=12)ctx.lineTo(x,sy(terrain(camX+x)));ctx.lineTo(viewW+12,viewH+100);ctx.closePath();ctx.fillStyle='#8b6547';ctx.fill();ctx.beginPath();for(let x=0;x<=viewW+12;x+=12){const y=sy(terrain(camX+x));x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.lineWidth=15;ctx.strokeStyle='#54834c';ctx.stroke();ctx.lineWidth=5;ctx.strokeStyle='#8cba61';ctx.stroke();for(let i=Math.floor(camX/29);i<Math.ceil((camX+viewW)/29);i++){const x=i*29+hash(i)*14,y=terrain(x);if(sy(y)>viewH+15)continue;ctx.strokeStyle='#507a48';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(sx(x),sy(y));ctx.lineTo(sx(x)-4,sy(y)-7-hash(i+2)*7);ctx.moveTo(sx(x),sy(y));ctx.lineTo(sx(x)+5,sy(y)-5);ctx.stroke();if(i%8===0)ellipse(ctx,sx(x),sy(y)+21,4,2,'#ac8960')}}
function flower(f){const x=sx(f.x),y=sy(terrain(f.x)),h=13+hash(f.x)*12;ctx.strokeStyle='#497a46';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-h);ctx.stroke();const color=['#f6d569','#f4a6a8','#f6f1df','#a99bd9','#ee9266'][f.type];for(let j=0;j<5;j++){const a=j*TAU/5;ellipse(ctx,x+Math.cos(a)*4,y-h+Math.sin(a)*4,3.4,3.4,color)}ellipse(ctx,x,y-h,2.5,2.5,'#c7883e')}
function object(o){const x=sx(o.x),y=sy(o.y),g=sy(terrain(o.x));if(x< -150||x>viewW+150||y>viewH+100)return;ctx.save();if(o.used)ctx.globalAlpha=.58;if(o.kind==='mushroom'||o.kind==='mega'){ctx.fillStyle='#f3dfb8';ctx.fillRect(x-7,y+8,14,g-y-5);ctx.beginPath();ctx.ellipse(x,y+16,o.w/2,17,0,Math.PI,TAU);ctx.closePath();ctx.fillStyle=o.kind==='mega'?'#e9ac37':'#c96254';ctx.fill();for(let j=0;j<5;j++)ellipse(ctx,x+(j-2)*o.w/7,y+8+hash(j)*4,3,2.5,'#fff1d2')}else if(o.kind==='log'){ctx.fillStyle='#986342';ctx.fillRect(x-o.w/2,y+2,o.w,g-y);ellipse(ctx,x+o.w/2,y+10,10,10,'#d9ad78');ellipse(ctx,x+o.w/2,y+10,5,5,'#a67852')}else if(o.kind==='mud'){ellipse(ctx,x,g+2,o.w/2,11,'#5a4938');ellipse(ctx,x-20,g,22,3,'#876e50')}else if(o.kind==='pipe'){ctx.fillStyle='#799079';ctx.fillRect(x-18,y+4,36,g-y);ctx.fillStyle='#aec2a0';ctx.fillRect(x-26,y,52,10);ellipse(ctx,x,y+2,19,5,'#405d50')}else{for(let j=0;j<4;j++)ellipse(ctx,x+(j-1.5)*25,y+11,24,16+(j%2)*8,'#fff9e9');ellipse(ctx,x,y+18,62,12,'#fff9e9')}ctx.restore()}
function platform(){if(camX>350)return;const x=sx(120),y=sy(0);ctx.save();ctx.translate(x,y);ellipse(ctx,0,1,68,12,'#476f4940');ctx.fillStyle='#976842';ctx.fillRect(-56,-22,112,25);ctx.fillStyle='#c59a65';ctx.fillRect(-59,-27,118,8);ctx.strokeStyle='#765338';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(0,-105);ctx.stroke();let ang=mode==='swing'?lerp(-1.35,1.0,spin):-.98;ctx.save();ctx.translate(0,-105);ctx.rotate(ang);ctx.fillStyle='#c99a5d';ctx.fillRect(-86,-6,172,12);ellipse(ctx,0,0,11,11,'#745138');ellipse(ctx,77,0,20,12,'#a97849');ctx.restore();ctx.restore()}
function render(){ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);sky();ground();for(const f of flowers)flower(f);for(const o of world)object(o);platform();for(const v of particles){ctx.globalAlpha=clamp(v.life*1.8,0,1);ellipse(ctx,sx(v.x),sy(v.y),3,3,v.color)}ctx.globalAlpha=1;if(mode!=='pipe'&&!(mode==='pause'&&previous==='pipe')){if(mode==='swing'||mode==='ready'||mode==='menu'||(mode==='pause'&&['swing','ready'].includes(previous))){const a=mode==='swing'||(mode==='pause'&&previous==='swing')?lerp(-1.35,1.0,spin):-.98;gnome(ctx,sx(120)+77*Math.cos(a),sy(-105)+77*Math.sin(a)-23,p.r,types[selected],a*.25)}else{if(mode==='fly'&&Math.abs(p.vy)>200){ctx.strokeStyle='#fff8dcaa';ctx.lineWidth=2;for(let i=0;i<4;i++){const x=sx(p.x)-35-i*8,y=sy(p.y)+i*5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-24,y-p.vy*.018);ctx.stroke()}}gnome(ctx,sx(p.x),sy(p.y),p.r,types[selected],p.rot)}}if(camY<-450){ctx.fillStyle='#fff9e8';ctx.font='bold 12px system-ui';ctx.textAlign='right';ctx.fillText('✦ SPACE · '+Math.floor(-p.y/10)+' m',viewW-15,viewH-24);ctx.textAlign='left'}}
function loop(now){const dt=last?Math.min(.08,(now-last)/1000):0;last=now;acc+=dt;while(acc>=1/120){step(1/120);acc-=1/120}if(['fly','pipe','result'].includes(mode))refresh();render();requestAnimationFrame(loop)}
function select(i){selected=i;for(const [j,b] of Array.from($('choices').children).entries())b.setAttribute('aria-pressed',String(j===i));$('desc').textContent=types[i].desc;if(mode==='menu')reset()}
for(let i=0;i<types.length;i++){const b=document.createElement('button'),c=document.createElement('canvas'),s=document.createElement('span');b.className='pick';b.type='button';b.setAttribute('aria-label',types[i].name+' '+types[i].desc);c.width=90;c.height=80;s.textContent=types[i].name;gnome(c.getContext('2d'),45,48,22,types[i]);b.append(c,s);b.addEventListener('click',()=>select(i));$('choices').append(b)}
$('start').addEventListener('click',ready);$('retry').addEventListener('click',ready);$('change').addEventListener('click',goMenu);$('home').addEventListener('click',goMenu);$('pause').addEventListener('click',togglePause);$('resume').addEventListener('click',togglePause);$('act').addEventListener('click',input);$('sound').addEventListener('click',()=>{muted=!muted;store('gnomeSound',muted?'0':'1');audioStart();refresh();if(!muted)tone()});canvas.addEventListener('pointerdown',e=>{if(e.isPrimary&&['ready','swing','fly'].includes(mode)){e.preventDefault();input()}});addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'&&(['ready','swing','fly'].includes(mode)||!['BUTTON','INPUT','TEXTAREA'].includes(document.activeElement?.tagName))){e.preventDefault();input()}else if(e.code==='Escape'){e.preventDefault();togglePause()}else if(e.code==='ArrowRight'&&mode==='menu')select((selected+1)%types.length);else if(e.code==='ArrowLeft'&&mode==='menu')select(mod(selected-1,types.length))});document.addEventListener('visibilitychange',()=>{if(document.hidden&&['ready','swing','fly','pipe'].includes(mode))togglePause();last=0;acc=0});addEventListener('resize',resize);resize();select(0);ui();requestAnimationFrame(loop);
})();
</script></body></html>
