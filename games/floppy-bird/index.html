
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floppy Bird</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: linear-gradient(160deg,#91e9ff,#d5f8ff);
  font-family: Arial,sans-serif;
  text-align: center;
  color: #263b50;
  overflow-x: hidden;
}
header {
  padding: 18px 10px 5px;
}
h1 {
  font-size: 35px;
  margin: 5px;
  color: #ff8c32;
  text-shadow: 2px 3px white;
}
.subtitle { font-size: 13px; color: #55758a; }
.stats {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 12px auto;
  flex-wrap: wrap;
}
.stat {
  background: white;
  border-radius: 14px;
  padding: 10px 18px;
  min-width: 125px;
  box-shadow: 0 4px 10px #5a9bb533;
}
.stat small { display:block; color:#789; font-size:12px; }
.stat strong { font-size:25px; color:#ff8c32; }
.slot {
  display:flex;
  justify-content:center;
  gap:3px;
  margin-top:5px;
}
.digit {
  background:#243747;
  color:#8dffb1;
  width:25px;
  height:34px;
  border-radius:5px;
  font-family:monospace;
  font-size:24px;
  line-height:34px;
  box-shadow:inset 0 2px 5px #0008;
}
.game-wrap {
  position:relative;
  width:min(420px,96vw);
  margin:10px auto;
  border:5px solid white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 8px 25px #377b9b44;
  background:#83dfff;
  touch-action:none;
}
canvas {
  display:block;
  width:100%;
  height:auto;
  touch-action:none;
}
.overlay {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#15334b66;
  color:white;
  padding:20px;
}
.overlay.hidden { display:none; }
.overlay h2 {
  font-size:35px;
  margin:5px;
  text-shadow:2px 3px #345;
}
.overlay p {
  font-size:17px;
  line-height:1.8;
  font-weight:bold;
}
button {
  border:0;
  background:linear-gradient(135deg,#ffb347,#ff783c);
  color:white;
  font-size:19px;
  font-weight:bold;
  padding:14px 35px;
  border-radius:30px;
  cursor:pointer;
  box-shadow:0 5px 0 #c95d2b;
}
button:active { transform:translateY(3px); box-shadow:0 2px 0 #c95d2b; }
.instructions {
  color:#47758a;
  font-size:13px;
  padding:8px;
}
</style>
</head>
<body>

<header>
  <h1>🐤 FLOPPY BIRD</h1>
  <div class="subtitle">TAP TO FLY!</div>
</header>

<div class="stats">
  <div class="stat">
    <small>🏆 SCORE</small>
    <strong id="score">0</strong>
  </div>
  <div class="stat">
    <small>👑 BEST</small>
    <strong id="best">0</strong>
  </div>
  <div class="stat">
    <small>👀 VIEWERS</small>
    <div class="slot" id="views"></div>
  </div>
</div>

<div class="game-wrap">
  <canvas id="game" width="420" height="700"></canvas>

  <div class="overlay" id="start">
    <h2>🐤 FLOPPY BIRD</h2>
    <p>ドカンをよけて進もう！<br>タップ または ENTER</p>
    <button id="startBtn">GAME START</button>
  </div>

  <div class="overlay hidden" id="over">
    <h2>GAME OVER</h2>
    <p>通過したドカン<br><span id="finalScore" style="font-size:38px;color:#ffe66d">0</span> 本</p>
    <button id="retryBtn">もう一度！</button>
  </div>
</div>

<div class="instructions">
  📱 画面タップ ／ 💻 ENTERキーでジャンプ
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 420, H = 700;
const ground = 650;

let bird, pipes, score, state, frame;
let animation;
let best = Number(localStorage.getItem("floppyBest") || 0);

document.getElementById("best").textContent = best;

// 閲覧数（このブラウザ内での閲覧回数）
let views = Number(localStorage.getItem("floppyViews") || 0);
views = Math.min(9999, views + 1);
localStorage.setItem("floppyViews", views);

function showViews() {
  const el = document.getElementById("views");
  el.innerHTML = "";
  String(views).padStart(4,"0").split("").forEach(n => {
    const d = document.createElement("div");
    d.className = "digit";
    d.textContent = n;
    el.appendChild(d);
  });
}
showViews();

function reset() {
  bird = {x:105,y:320,vy:0,r:17,rotation:0};
  pipes = [];
  score = 0;
  frame = 0;
  state = "ready";
  document.getElementById("score").textContent = 0;
  draw();
}

function startGame() {
  if (state === "over" || state === "running") return;
  document.getElementById("start").classList.add("hidden");
  document.getElementById("over").classList.add("hidden");
  state = "running";
  bird.vy = -7.5;
}

function jump() {
  if (state === "ready") {
    startGame();
    return;
  }
  if (state === "running") bird.vy = -7.5;
}

function endGame() {
  if (state !== "running") return;
  state = "over";

  if (score > best) {
    best = score;
    localStorage.setItem("floppyBest",best);
    document.getElementById("best").textContent = best;
  }

  document.getElementById("finalScore").textContent = score;
  document.getElementById("over").classList.remove("hidden");
}

function addPipe() {
  const gap = 178;
  const top = 85 + Math.random() * 290;

  pipes.push({
    x: W + 10,
    top,
    bottom: top + gap,
    scored:false
  });
}

function drawPipe(x,y,w,h,flip=false) {
  ctx.save();
  if (flip) {
    ctx.translate(0,2*y+h);
    ctx.scale(1,-1);
    y = 0;
  }

  const gradient = ctx.createLinearGradient(x,0,x+w,0);
  gradient.addColorStop(0,"#168e48");
  gradient.addColorStop(.35,"#52df6b");
  gradient.addColorStop(.75,"#27b94f");
  gradient.addColorStop(1,"#087b38");

  ctx.fillStyle = gradient;
  ctx.fillRect(x,y,w,h);

  ctx.fillStyle = "#83ff8c";
  ctx.fillRect(x+9,y,9,h);

  ctx.fillStyle = "#168b3b";
  ctx.fillRect(x-6,y+h-24,w+12,24);

  ctx.fillStyle = "#63ee72";
  ctx.fillRect(x-6,y+h-24,10,24);

  ctx.restore();
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.rotate(bird.rotation);

  // 体
  ctx.fillStyle="#ffd43b";
  ctx.beginPath();
  ctx.ellipse(0,0,20,16,0,0,Math.PI*2);
  ctx.fill();

  // 羽
  ctx.fillStyle="#f4a923";
  ctx.beginPath();
  ctx.ellipse(-7,4,10,7,-.4,0,Math.PI*2);
  ctx.fill();

  // 目
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(9,-6,7,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#263747";
  ctx.beginPath();
  ctx.arc(11,-6,3,0,Math.PI*2);
  ctx.fill();

  // くちばし
  ctx.fillStyle="#ff793b";
  ctx.beginPath();
  ctx.moveTo(16,1);
  ctx.lineTo(30,5);
  ctx.lineTo(16,9);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function background() {
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#70d8ff");
  sky.addColorStop(1,"#d1f7ff");
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  // 雲
  ctx.fillStyle="#ffffffaa";
  for(let i=0;i<4;i++){
    const x=((i*137-frame*.35)%(W+120)+W+120)%(W+120)-60;
    const y=100+i*115;
    ctx.beginPath();
    ctx.arc(x,y,22,0,Math.PI*2);
    ctx.arc(x+25,y-9,27,0,Math.PI*2);
    ctx.arc(x+51,y,20,0,Math.PI*2);
    ctx.fill();
  }

  // 地面
  ctx.fillStyle="#9bdc54";
  ctx.fillRect(0,ground,W,H-ground);
  ctx.fillStyle="#5eae39";
  ctx.fillRect(0,ground,W,12);

  ctx.fillStyle="#b9ed75";
  for(let x=0;x<W;x+=35){
    ctx.fillRect((x-frame*2%35+35)%W,ground+20,18,7);
  }
}

function draw() {
  background();

  pipes.forEach(p=>{
    drawPipe(p.x,0,70,p.top,true);
    drawPipe(p.x,p.bottom,70,ground-p.bottom,false);
  });

  drawBird();

  if(state==="ready"){
    ctx.fillStyle="#ffffff";
    ctx.font="bold 20px Arial";
    ctx.textAlign="center";
    ctx.fillText("TAP OR PRESS ENTER",W/2,540);
  }
}

function update() {
  if(state==="running"){
    frame++;

    bird.vy += .38;
    bird.y += bird.vy;
    bird.rotation = Math.min(.9,Math.max(-.5,bird.vy*.07));

    if(frame % 95 === 0) addPipe();

    pipes.forEach(p=>{
      p.x -= 2.8;

      if(!p.scored && p.x+70 < bird.x){
        p.scored=true;
        score++;
        document.getElementById("score").textContent=score;
      }

      // 衝突判定
      const bx=bird.x, by=bird.y, r=13;
      const hitX=bx+r>p.x && bx-r<p.x+70;
      if(hitX && (by-r<p.top || by+r>p.bottom)){
        endGame();
      }
    });

    pipes=pipes.filter(p=>p.x>-90);

    if(bird.y+bird.r>ground || bird.y-bird.r<0){
      endGame();
    }
  } else {
    if(state==="ready"){
      bird.y=320+Math.sin(Date.now()/250)*7;
    }
  }

  draw();
  animation=requestAnimationFrame(update);
}

function handleInput(e) {
  if(e.type==="keydown"){
    if(e.key!=="Enter") return;
    e.preventDefault();
  } else {
    e.preventDefault();
  }

  if(state==="over") return;
  jump();
}

canvas.addEventListener("pointerdown",handleInput);
document.addEventListener("keydown",handleInput);

document.getElementById("startBtn").addEventListener("click",()=>{
  startGame();
});
document.getElementById("retryBtn").addEventListener("click",()=>{
  reset();
  startGame();
});

reset();
if(animation) cancelAnimationFrame(animation);
update();
</script>
</body>
</html>
