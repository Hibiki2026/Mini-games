<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゲームデータの一括移行</title><style>:root{font:16px/1.8 system-ui;color:#e5f2ff;background:#0a1420;color-scheme:dark}*{box-sizing:border-box}main{max-width:800px;margin:40px auto;padding:24px}h1{font-size:28px}h2{font-size:19px}p{color:#abc4d5}button,input,textarea{font:inherit;color:inherit;background:#193249;border:1px solid #56768b;padding:12px;border-radius:8px}button{cursor:pointer}button:disabled{opacity:.4}a{color:#a0e8cf}section{padding:20px;border:1px solid #345065;border-radius:12px;margin:20px 0}textarea{width:100%;min-height:70px}label{display:block;margin:12px 0}#status{white-space:pre-wrap}</style></head><body data-transfer="export"><main><a href="./">ミニゲームへ戻る</a><h1>LINK BASE GAMESへまとめて移す</h1><p>以前遊んでいたブラウザで開いてください。最高記録・プレイ回数・保存済みの2048の盤面・設定をまとめてJSONファイルに書き出します。元データは削除しません。</p><section><h2>途中のスイカ・Pacmanも移す場合</h2><p>各ゲーム内でセーブコードを発行し、ここに貼り付けると同じファイルにまとめられます。保存していない対局・進行は読み取れません。</p><label>スイカのセーブコード（任意）<textarea id="suikaCode" spellcheck="false"></textarea></label><label>Pacmanのセーブコード（任意）<textarea id="pacmanCode" spellcheck="false"></textarea></label></section><button id="export">全ゲームの保存データを書き出す</button><p id="status" role="status"></p><p>書き出したファイルを、LINK BASE GAMESの「元のミニゲームからデータをまとめて移す」で読み込んでください。ログイン情報など、ゲーム以外の情報は含めません。</p></main><script src="migration.js?v=1"></script></body></html>
